[package]
name = "flare"
description = "A unofficial Signal GTK client."
version = "0.4.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gio = "0.15.12"
gtk = { version = "0.4.8", package = "gtk4", features = ["v4_6"]}
gdk = { version = "0.4.8", package = "gdk4" }
gdk-pixbuf = "0.15.11"
glib = "0.15.12"
libadwaita = { version = "0.2.0-alpha.2", features = ["v1_2"]}

gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
 
futures = "0.3.24"
tokio = { version = "1.20.1", features = ["rt", "macros", "rt-multi-thread", "time"] }
async-recursion = "1.0.0"

presage = { git = "https://github.com/whisperfish/presage", rev = "de61481fee93a8bcfe568f1c1c4fd7024aaf9474" }
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "refs/pull/156/head" }

async-trait = "0.1.57"
sled = "0.34.7"
libsecret = { version = "0.1.4", features = ["v0_19"] }
rand = "0.8.5"
# Cannot update to 0.10.1 because of conflict with zeroize
chacha20poly1305 = "0.9.1"
encrypted-sled = "0.2.0"
hex = "0.4.3"
serde = "1.0"
serde_json = "1.0.85"
url = "2.2.2"

qrcode-generator = "4.1.6"

log = "0.4.17"
env_logger = "0.9.0"

err-derive = "0.3.1"

[features]
default = []
screenshot = []

[patch.crates-io]
"curve25519-dalek" = { git = 'https://github.com/signalapp/curve25519-dalek', branch = 'lizard2' }
