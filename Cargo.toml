[package]
name = "flare"
description = "Chat with your friends on Signal"
authors = ["Julian Schmidhuber <schmidhuberj2@protonmail.com>"]
homepage = "https://mobile.schmidhuberj.de/flare"
repository = "https://gitlab.com/schmiddi-on-mobile/flare"
version = "0.10.1-beta.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Optimize presage-store-cipher, as otherwise opening the store takes 6 seconds.
[profile.dev.package.presage-store-cipher]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[dependencies]
gtk = { version = "0.7.3", package = "gtk4", features = ["v4_12"]}
gdk = { version = "0.7.3", package = "gdk4" }
adw = { version = "0.5.3", package = "libadwaita", features = ["v1_4"]}
ashpd = { version = "0.6.7", default-features = false, features = [ "gtk4", "tokio" ]}
zbus = { version = "3.14.1", default-features = false, features = [ "tokio" ]}

gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
 
futures = "0.3.29"
tokio = { version = "1.34.0", features = ["rt", "macros", "rt-multi-thread", "time"] }
regex = "1.10.2"
lazy_static = "1.4.0"

presage = { git = "https://github.com/Schmiddiii/presage", rev = "eed6c9c484e994a72d0e099b5082421f77edb7d2" }
presage-store-sled = { git = "https://github.com/Schmiddiii/presage", rev = "eed6c9c484e994a72d0e099b5082421f77edb7d2" }
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "f40eb4f" }

async-trait = "0.1.74"
sled = "0.34.7"
oo7 = { version = "0.2.1", default-features = false, features = ["native_crypto", "tokio"] }
rand = "0.8.5"
hex = "0.4.3"
serde = "1.0.192"
serde_json = "1.0.108"
url = "2.4.1"
once_cell = "1.18.0"

qrcode-generator = "4.1.9"

log = "0.4.20"
env_logger = "0.10.1"

err-derive = "0.3.1"

tracing = { version = "0.1.40", features = ["log-always"] }
sourceview5 = "0.7.1"
libspelling = "0.1.0"
blurhash = { version = "0.2.0", features = ["image", "gdk-pixbuf"] }
image = "0.24.7"

[features]
default = []
screenshot = []
libspelling = []

[patch.crates-io]
curve25519-dalek = { git = 'https://github.com/signalapp/curve25519-dalek', tag = 'signal-curve25519-4.0.0' }
