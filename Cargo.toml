[package]
name = "flare"
description = "A unofficial Signal GTK client."
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gio = "0.15.10"
gtk = { version = "0.4.6", package = "gtk4", features = ["v4_6"]}
gdk = { version = "0.4.6", package = "gdk4" }
gdk-pixbuf = "0.15.10"
libadwaita = "0.1.0"
gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
 
futures = "0.3"
tokio = { version = "1.17.0", features = ["rt", "macros", "rt-multi-thread", "time"] }

async-trait = "0.1"
sled = "0.34"
presage = { git = "https://github.com/whisperfish/presage.git", rev = "aa6e333d5400f4d6361552c4c40161790e1171d7" }
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "1508fa8f3561e3807aa8d073ca05a61346ae5a82" }
libsecret = { version = "0.1.4", features = ["v0_19"] }
rand = "0.8.5"
chacha20poly1305 = "0.9.0"
encrypted-sled = "0.2"
hex = "0.4.3"
serde = "1.0"
serde_json = "1.0"
url = "2.2.2"

qrcode-generator = "4.1.6"

log = "0.4.14"
env_logger = "0.9.0"

err-derive = "0.3.1"

[features]
default = []
screenshot = []

[patch.crates-io]
"curve25519-dalek" = { git = 'https://github.com/signalapp/curve25519-dalek', branch = 'lizard2' }
