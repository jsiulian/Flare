[package]
name = "flare"
description = "Chat with your friends on Signal"
authors = ["Julian Schmidhuber <schmidhuberj2@protonmail.com>"]
homepage = "https://mobile.schmidhuberj.de/flare"
repository = "https://gitlab.com/schmiddi-on-mobile/flare"
version = "0.10.1-beta.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Optimize matrix-sdk-store-encryption, as otherwise opening the store takes 6 seconds.
[profile.dev.package.matrix-sdk-store-encryption]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[dependencies]
gtk = { version = "0.7.2", package = "gtk4", features = ["v4_10"]}
gdk = { version = "0.7.2", package = "gdk4" }
adw = { version = "0.5.2", package = "libadwaita", features = ["v1_4"]}
ashpd = { version = "0.5.0", features = ["gtk4"]}
zbus = "3.14.1"

gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
 
futures = "0.3.28"
tokio = { version = "1.29.1", features = ["rt", "macros", "rt-multi-thread", "time"] }
regex = "1.9.3"
lazy_static = "1.4.0"

presage = { git = "https://github.com/Schmiddiii/presage", rev = "1cdc047a53326435bd72fead0f67992433dc07b2" }
presage-store-sled = { git = "https://github.com/Schmiddiii/presage", rev = "1cdc047a53326435bd72fead0f67992433dc07b2" }
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "8789920"  }

async-trait = "0.1.72"
sled = "0.34.7"
oo7 = { version = "0.2.1", default-features = false, features = ["native_crypto", "async-std"] }
rand = "0.8.5"
zeroize = "1.6.0"
hex = "0.4.3"
serde = "1.0"
serde_json = "1.0.104"
url = "2.4.0"
once_cell = "1.18.0"

qrcode-generator = "4.1.8"

log = "0.4.19"
env_logger = "0.10.0"

err-derive = "0.3.1"

tracing = { version = "0.1.37", features = ["log-always"] }
sourceview5 = "0.7.1"
libspelling = "0.1.0"
blurhash = { git = 'https://github.com/marc0x1/blurhash-rs', branch = "pixbuf-patch", features = ["image", "gdk-pixbuf"] }
image = "0.23.14"

[features]
default = []
screenshot = []
libspelling = []

[patch.crates-io]
"curve25519-dalek" = { git = 'https://github.com/Schmiddiii/curve25519-dalek', rev = '1b9f81352bb659999a46af961f069d635ca432d3' }

[patch."https://github.com/signalapp/curve25519-dalek"]
"curve25519-dalek" = { git = 'https://github.com/Schmiddiii/curve25519-dalek', rev = '1b9f81352bb659999a46af961f069d635ca432d3' }
