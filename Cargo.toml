[package]
name = "flare"
description = "An unofficial Signal GTK client."
version = "0.6.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gtk = { version = "0.6.2", package = "gtk4", features = ["v4_8"]}
gdk = { version = "0.6.2", package = "gdk4" }
libadwaita = { version = "0.3.1", features = ["v1_2"]}
ashpd = { version = "0.4.0-alpha.4", features = ["gtk4"]}
zbus = "3.10.0"

gettext-rs = { version = "0.7.0", features = ["gettext-system"] }
 
futures = "0.3.26"
tokio = { version = "1.25.0", features = ["rt", "macros", "rt-multi-thread", "time"] }
async-recursion = "1.0.2"
regex = "1.7.0"
lazy_static = "1.4.0"

presage = { git = "https://github.com/whisperfish/presage.git", rev = "fd483c7c543760665b30d95ba131dfae42b45370" }
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "456bf6eb2e4454ce35bdb4ca75b8dba7941c2923" }

async-trait = "0.1.57"
sled = "0.34.7"
libsecret = { version = "0.3.0", features = ["v0_19"] }
rand = "0.8.5"
# Cannot update to 0.10.1 because of conflict with zeroize
chacha20poly1305 = "0.9.1"
encrypted-sled = "0.2.0"
hex = "0.4.3"
serde = "1.0"
serde_json = "1.0.85"
url = "2.2.2"

qrcode-generator = "4.1.6"

log = "0.4.17"
env_logger = "0.9.0"

err-derive = "0.3.1"

tracing = { version = "0.1.37", features = ["log-always"] }

[features]
default = []
screenshot = []

[patch.crates-io]
"curve25519-dalek" = { git = 'https://github.com/signalapp/curve25519-dalek', branch = 'lizard2' }
