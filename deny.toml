[licenses]
allow = [
# These should all be AGPLv3-only compatible
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    "BSD-3-Clause",
    "BSD-2-Clause",

    "AGPL-3.0-only",

    "Zlib",
    "ISC",
    "Unicode-3.0",
    "NCSA",
    "MPL-2.0"
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "presage"
expression = "AGPL-3.0-only"
license-files = []

[[licenses.clarify]]
name = "presage-store-sled"
expression = "AGPL-3.0-only"
license-files = []

[[licenses.clarify]]
name = "presage-store-cipher"
expression = "AGPL-3.0-only"
license-files = []

[[licenses.clarify]]
name = "sourceview5"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "sqlcipher-crypto-provider"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"

[sources.allow-org]
github = ["whisperfish", "signalapp", "Schmiddiii", "gferon"]

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # Unmaintained "paste", but used by "image"; cannot do much about it right now.
    "RUSTSEC-2025-0141", # Unmaintained "bincode"; cannot do much about it, and we only (transitively) use an old version that is considered complete.
    "RUSTSEC-2023-0089", # Unmaintained "atomic-polyfill"; can't do much about it right now.
]
